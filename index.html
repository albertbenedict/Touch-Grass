<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Grass Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5233">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#ece6d6; --card:#f7f3e8; --ink:#1c2119; --green:#2f6b3b; --orange:#ff6a2b; --muted:#6b6f60; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141813; --card:#1f251d; --ink:#ece8d8; --green:#7fc48a; --orange:#ff8a4d; --muted:#9aa08c; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:30rem; margin:0 auto; padding:1.1rem 1.1rem 6rem; }
  .cond, h1, h2, .tag, .seg button, .btn, button, .lbl { font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif; text-transform:uppercase; letter-spacing:.06em; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; margin-bottom:1rem; }
  h1 { margin:0; font-size:1.9rem; line-height:.9; font-weight:800; }
  h1 small { display:block; font-size:.8rem; letter-spacing:.35em; color:var(--orange); font-weight:700; margin-top:.2rem; }
  h2 { margin:0 0 .75rem; font-size:1.1rem; font-weight:800; }
  .tag { border:2px solid var(--ink); padding:.2rem .55rem; font-weight:700; font-size:.8rem; background:var(--card); white-space:nowrap; }
  .card { background:var(--card); border:2px solid var(--ink); border-radius:4px; box-shadow:4px 4px 0 var(--ink); }
  .lbl { font-size:.72rem; font-weight:700; color:var(--muted); margin:0 0 .35rem; }

  button, .btn { font-weight:800; font-size:.9rem; padding:.7rem 1rem; border:2px solid var(--ink); border-radius:4px; background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--orange); color:#1c2119; box-shadow:3px 3px 0 var(--ink); }
  button.primary:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  button:disabled, .btn.disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  button:focus-visible, .btn:focus-within { outline:3px solid var(--orange); outline-offset:2px; }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }

  .plant { display:flex; gap:.9rem; align-items:center; padding:.8rem; margin-bottom:1rem; }
  .plant .art { width:4.6rem; flex:none; color:var(--ink); }
  .plant .art svg { width:100%; display:block; transition:transform .4s; transform-origin:50% 90%; }
  .plant.droop .art svg { transform:rotate(14deg); filter:grayscale(1); }
  .plant .grow { flex:1; min-width:0; }
  .plant .row { display:flex; justify-content:space-between; align-items:baseline; font-weight:800; }
  .plant .row .cond { font-size:1.05rem; }
  .meter { height:.8rem; border:2px solid var(--ink); border-radius:2px; margin:.35rem 0; background:transparent; }
  .meter > div { height:100%; width:0; background:var(--orange); transition:width .4s; }
  .plant p { margin:0; font-size:.8rem; color:var(--muted); line-height:1.3; }

  .daily { display:flex; align-items:center; gap:.75rem; justify-content:space-between; padding:.6rem .8rem; margin-bottom:1rem; border:2px solid var(--ink); border-left:.6rem solid var(--green); background:var(--card); }
  .daily strong { display:block; font-size:.85rem; }
  .daily span { font-size:.8rem; color:var(--muted); }
  .daily button { padding:.4rem .8rem; flex:none; }

  .quest { padding:1.1rem 1.1rem 1rem; min-height:9.5rem; }
  .quest .text { margin:.1rem 0 .8rem; font-size:1.55rem; line-height:1.18; font-weight:700; letter-spacing:-.01em; }
  .quest .target { margin:0; font-size:.85rem; color:var(--muted); }
  .actions { display:flex; gap:.7rem; margin:1rem 0; }
  .actions .big { flex:1; font-size:1.05rem; padding:.95rem; }
  .next { margin-top:1.2rem; }
  .seg { display:flex; border:2px solid var(--ink); border-radius:4px; overflow:hidden; margin-bottom:.6rem; }
  .seg button { flex:1; border:0; border-right:2px solid var(--ink); border-radius:0; padding:.5rem .3rem; font-size:.78rem; background:transparent; }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed=true] { background:var(--ink); color:var(--bg); }
  .next small { color:var(--muted); font-size:.78rem; }

  .stamps { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; }
  .stamp { aspect-ratio:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:.3rem; border:2px dashed var(--muted); color:var(--muted); border-radius:4px; transform:rotate(var(--r,0deg)); }
  .stamp b { font:800 .95rem/1.1 "Arial Narrow","Roboto Condensed",Arial,sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .stamp small { font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; margin-top:.25rem; }
  .stamp.got { border:3px solid var(--green); color:var(--green); background:color-mix(in srgb,var(--green) 12%,transparent); }

  nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; background:var(--card); border-top:2px solid var(--ink); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav.tabs button { flex:1; border:0; border-radius:0; padding:.95rem; background:transparent; box-shadow:none; }
  nav.tabs button + button { border-left:2px solid var(--ink); }
  nav.tabs button[aria-selected=true] { background:var(--ink); color:var(--bg); }

  #cam { position:fixed; inset:0; z-index:10; background:#000; display:flex; flex-direction:column; }
  #cam video { flex:1; width:100%; min-height:0; object-fit:cover; }
  #cam .bar { display:flex; justify-content:center; gap:1rem; padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px)); background:#000; }
  #cam .bar button { border-color:#f7f3e8; color:#f7f3e8; background:transparent; }
  #cam .bar button.primary { background:var(--orange); border-color:var(--orange); color:#1c2119; box-shadow:none; }
  #preview { display:block; width:100%; max-height:16rem; object-fit:cover; border:2px solid var(--ink); border-radius:4px; margin-bottom:.8rem; }
  #result { font-weight:700; min-height:1.4rem; margin:0 0 .4rem; }
  #result.win { color:var(--green); }
  #load { margin:.6rem 0; }
  #loadText, #status { font-size:.8rem; color:var(--muted); margin:0; word-break:break-word; }
</style>
</head>
<body>
<main>
  <div id="viewQuest">
    <header>
      <h1>Touch Grass<small>Quest</small></h1>
      <div class="tag mono" id="streak" title="Streaks multiply your XP">0 day streak x1.0</div>
    </header>

    <section class="card plant" id="plant" aria-live="polite">
      <div class="art" id="plantIcon" aria-hidden="true"></div>
      <div class="grow">
        <div class="row"><span class="cond" id="stageName">Seedling</span><span class="mono" id="xpText">0 XP</span></div>
        <div class="meter"><div id="xpBar"></div></div>
        <p id="plantText"></p>
      </div>
    </section>

    <section class="daily">
      <div><strong>Today's shared quest</strong><span id="dailyText"></span></div>
      <button id="dailyQuest">Start</button>
    </section>

    <section class="card quest" aria-live="polite">
      <p class="lbl">Your quest</p>
      <p class="text" id="questText">Finding you a quest…</p>
      <p class="target" id="targetText"></p>
    </section>

    <div class="actions">
      <button class="primary big" id="checkinBtn" disabled>Open camera</button>
      <button id="skipQuest">Skip</button>
    </div>
    <label class="btn disabled" id="devUpload" hidden>Upload (dev only)<input type="file" id="photo" accept="image/*" disabled></label>

    <img id="preview" alt="Your check-in photo" hidden>
    <p id="result" role="status"></p>
    <div id="load" hidden><div class="meter"><div id="loadBar"></div></div><p id="loadText"></p></div>
    <p id="status" role="status"></p>

    <section class="next">
      <p class="lbl">Next quest vibe</p>
      <div class="seg" id="vibeChips" role="group" aria-label="Vibe">
        <button data-v="chill">Chill</button><button data-v="adventurous">Wild</button><button data-v="quick, 10-minute">Quick</button>
      </div>
      <small>Vibe applies to your next quest. Difficulty is random.</small>
    </section>
  </div>

  <div id="viewDex" hidden>
    <header><h1>Grass Dex<small>Your stamps</small></h1><div class="tag mono" id="dexSummary">0/0</div></header>
    <ul class="stamps" id="dexList"></ul>
  </div>

  <div id="cam" hidden role="dialog" aria-label="Camera">
    <video id="camVideo" playsinline muted autoplay></video>
    <div class="bar"><button id="camClose">Cancel</button><button class="primary" id="snap">Take photo</button></div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabQuest" aria-selected="true">Quest</button>
    <button role="tab" id="tabDex" aria-selected="false">Grass Dex</button>
  </nav>
</main>

<script type="module">
// models
const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5/+esm";
const LLM_CANDIDATES = [
  { id: "onnx-community/gemma-3-270m-it-ONNX", dtype: "q4", label: "Gemma 3 270M" },
  { id: "onnx-community/gemma-3-270m-it-ONNX", dtype: "q8", label: "Gemma 3 270M" },
  { id: "onnx-community/Qwen2.5-0.5B-Instruct", dtype: "q4", label: "Qwen2.5 0.5B" },
];
const CLIP_ID = "Xenova/clip-vit-base-patch32";

// game data
const TARGETS = {
  easy:   ["a tree", "a leaf", "grass", "the sky", "a cloud", "a flower"],
  medium: ["a puddle", "a bird", "an insect", "a yellow flower", "moss", "a stone", "a mushroom"],
  hard:   ["a spider web", "a feather", "a squirrel", "a cat", "a bridge over water", "a rainbow"],
};
const ALL = Object.entries(TARGETS).flatMap(([d, l]) => l.map((t) => [t, d]));
const BASE_XP = { easy: 10, medium: 20, hard: 40 };
const STAGES = [
  { xp: 0, icon: "🌱", name: "Seedling" }, { xp: 100, icon: "🌿", name: "Sprout" },
  { xp: 400, icon: "🪴", name: "Young plant" }, { xp: 1000, icon: "🌳", name: "Tree" },
  { xp: 2500, icon: "🌸", name: "Blossoming tree" },
];
const streakMult = (n) => 1 + Math.min(Math.max(n - 1, 0), 10) * 0.1; // x1.0 to x2.0 max
const NEGATIVES = ["an animal", "a person", "a face", "a building", "a car", "food", "a room indoors", "a computer screen", "a screenshot", "a road", "furniture"];
const ANIMAL_TARGETS = ["a bird", "an insect", "a squirrel", "a cat"];
const TEMPLATES = {
  chill: ["Take a slow walk and look for {t}.", "Find a quiet spot outside and spot {t}.", "Wander without a plan until you find {t}."],
  adventurous: ["Head somewhere you have never been and find {t}.", "Take the path you usually skip and find {t}.", "Go a little farther than usual and find {t}."],
  quick: ["Step outside for ten minutes and find {t}.", "Find {t} before your ten minutes are up.", "Take a quick lap around the block and spot {t}."],
};
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const randomDiff = () => { const r = Math.random(); return r < 0.5 ? "easy" : r < 0.8 ? "medium" : "hard"; }; // 50/30/20
const template = (vibe, t) => pick(TEMPLATES[vibe.startsWith("quick") ? "quick" : vibe] || TEMPLATES.chill).replace("{t}", t);

const $ = (id) => document.getElementById(id);
const status = (msg) => { $("status").textContent = msg; };
const DEV = location.search.includes("dev"); // dev mode
const COOLDOWN_MS = 60 * 1000;
const today = () => new Date().toLocaleDateString("en-CA");
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toLocaleDateString("en-CA"); };
const utcDay = () => new Date().toISOString().slice(0, 10);

// save data
let state = { xp: 0, streak: 0, lastDay: "", quest: null, dex: {}, dailyDone: "", vibe: "chill", cooldownUntil: 0 };
try { Object.assign(state, JSON.parse(localStorage.getItem("tgq") || "{}")); } catch {}
const save = () => { try { localStorage.setItem("tgq", JSON.stringify(state)); } catch {} };
const liveStreak = () => (state.lastDay === today() || state.lastDay === yesterday() ? state.streak : 0);
const cooldownLeft = () => (DEV ? 0 : Math.max(0, (state.cooldownUntil || 0) - Date.now()));

function dailyTarget() {
  let h = 0;
  for (const c of utcDay()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return ALL[h % ALL.length];
}

// render
function plantSVG(stage) {
  const h = 26 + stage * 15, top = 92 - h, leaves = Math.min(stage + 1, 4);
  let g = `<path d="M14 92h52" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M40 92V${top}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`;
  for (let i = 0; i < leaves; i++) {
    const y = 84 - i * ((h - 12) / leaves);
    g += `<ellipse cx="29" cy="${y}" rx="11" ry="5" transform="rotate(-28 29 ${y})" fill="var(--green)" stroke="currentColor" stroke-width="2"/>`;
    g += `<ellipse cx="51" cy="${y - 5}" rx="11" ry="5" transform="rotate(28 51 ${y - 5})" fill="var(--green)" stroke="currentColor" stroke-width="2"/>`;
  }
  if (stage >= 3) g += `<circle cx="40" cy="${top - 4}" r="${stage >= 4 ? 17 : 13}" fill="var(--green)" stroke="currentColor" stroke-width="2"/>`;
  if (stage >= 4) g += [[32, -8], [47, -2], [40, -16]].map(([dx, dy]) => `<circle cx="${40 + dx - 40 + 33}" cy="${top + dy}" r="3.5" fill="var(--orange)" stroke="currentColor" stroke-width="1.5"/>`).join("");
  return `<svg viewBox="0 0 80 100" role="img" aria-label="Your plant">${g}</svg>`;
}
function renderPlant() {
  let i = 0;
  STAGES.forEach((s, k) => { if (state.xp >= s.xp) i = k; });
  const cur = STAGES[i], next = STAGES[i + 1];
  const away = state.lastDay ? Math.floor((new Date(today()) - new Date(state.lastDay)) / 864e5) : 0;
  const droop = away >= 3;
  $("plantIcon").innerHTML = plantSVG(i);
  $("plant").classList.toggle("droop", droop);
  $("stageName").textContent = cur.name;
  $("xpText").textContent = `${state.xp} XP`;
  $("xpBar").style.width = next ? Math.round((100 * (state.xp - cur.xp)) / (next.xp - cur.xp)) + "%" : "100%";
  $("plantText").textContent = droop ? "Your plant is drooping. One quest wakes it up."
    : next ? `${next.xp - state.xp} XP to ${next.name}. Streaks multiply your XP, up to x2.` : "Fully grown. Keep the streak alive.";
}
function renderDaily() {
  const [t] = dailyTarget();
  const done = state.dailyDone === utcDay();
  const active = !!(state.quest && state.quest.daily && !state.quest.done);
  $("dailyText").textContent = done ? "Done. A new one arrives tomorrow." : `Everyone finds ${t} today. 2x XP.`;
  $("dailyQuest").hidden = done;
  $("dailyQuest").disabled = active;
  $("dailyQuest").textContent = active ? "In progress" : "Start";
}
function renderDex() {
  const got = ALL.filter(([t]) => state.dex[t]).length;
  $("dexSummary").textContent = `${got}/${ALL.length}`;
  $("dexList").innerHTML = ALL.map(([t, d], i) => {
    const day = state.dex[t];
    const when = day ? new Date(day + "T00:00").toLocaleDateString("en", { day: "2-digit", month: "short" }) : d;
    return `<li class="stamp${day ? " got" : ""}" style="--r:${day ? ((i * 37) % 7) - 3 : 0}deg"><b>${t.replace(/^(a|an|the) /, "")}</b><small>${when}</small></li>`;
  }).join("");
}
function questSub(q) {
  const qDiff = q.diff || "easy";
  const qBase = (BASE_XP[qDiff] || 10) * (q.daily ? 2 : 1);
  return `${q.done ? "Done" : "Photo target"}: ${q.target} • ${qDiff.toUpperCase()} · +${qBase} XP`;
}
function updateCamBtn() {
  const q = state.quest, b = $("checkinBtn");
  const usable = !!q && !q.done;
  const wait = usable ? cooldownLeft() : 0;
  const locked = usable && wait > 0;
  b.disabled = !usable || locked;
  const secs = Math.ceil(wait / 1000);
  b.textContent = locked ? `Back in ${secs}s` : "Open camera";
  $("photo").disabled = b.disabled;
  $("devUpload").classList.toggle("disabled", b.disabled);
  if (!q) return;
  if (locked && q.failGuess) {
    $("targetText").textContent = `Not quite. I think that looks like "${q.failGuess}". Try another angle.`;
    $("result").className = "";
    $("result").textContent = `Go enjoy the outside world in the meantime — back in ${secs}s`;
  } else if (locked) {
    $("targetText").textContent = `Go enjoy the outside world — back in ${secs}s`;
  } else {
    $("targetText").textContent = questSub(q);
    if (q.failGuess && $("result").textContent.startsWith("Go enjoy")) {
      $("result").className = "";
      $("result").textContent = `Not quite. I think that looks like "${q.failGuess}". Try another angle.`;
    }
  }
}
function render() {
  const q = state.quest;
  if (q) {
    $("questText").textContent = q.text;
    $("targetText").textContent = questSub(q);
  }
  const s = liveStreak();
  $("streak").textContent = `${s} day${s === 1 ? "" : "s"} streak x${streakMult(s).toFixed(1)}`;
  renderPlant(); renderDaily(); renderDex(); updateCamBtn();
}
setInterval(updateCamBtn, 1000);

// load models
const models = { gen: null, genName: "", clip: null };
const progress = { clip: 0, gen: 0 };
let clipState = "idle", genState = "idle", libP = null, clipP = null, genP = null;
const lib = () => (libP ||= import(TRANSFORMERS_URL));
function showLoad() {
  let label = "", pct = 0;
  if (clipState === "loading") { label = "Getting the photo checker ready"; pct = progress.clip; }
  else if (genState === "loading") { label = "Loading the quest writer in the background (you can already play)"; pct = progress.gen; }
  $("load").hidden = !label;
  if (label) { $("loadBar").style.width = Math.round(pct * 100) + "%"; $("loadText").textContent = `${label}… ${Math.round(pct * 100)}%`; }
}
function tracker(key) {
  const files = {};
  return (p) => {
    if (p.status === "progress" && p.total) files[p.file] = { l: p.loaded, t: p.total };
    else if (p.status === "done" && files[p.file]) files[p.file].l = files[p.file].t;
    const v = Object.values(files);
    const t = v.reduce((a, f) => a + f.t, 0);
    progress[key] = t ? v.reduce((a, f) => a + f.l, 0) / t : 0;
    showLoad();
  };
}
function ensureClip() {
  if (clipP) return clipP;
  clipState = "loading"; showLoad();
  clipP = (async () => {
    const { pipeline } = await lib();
    models.clip = await pipeline("zero-shot-image-classification", CLIP_ID, { progress_callback: tracker("clip") });
    clipState = "ready"; showLoad();
  })().catch((e) => {
    clipState = "failed"; clipP = null; showLoad();
    status("Photo checker failed to load: " + (e.message || e));
    throw e;
  });
  return clipP;
}
function ensureGen() {
  if (genP) return genP;
  genState = "loading"; showLoad();
  genP = (async () => {
    const { pipeline } = await lib();
    for (const c of LLM_CANDIDATES) {
      try {
        models.gen = await pipeline("text-generation", c.id, { dtype: c.dtype, progress_callback: tracker("gen") });
        models.genName = c.label;
        break;
      } catch (e) { console.error(`Quest model failed: ${c.id} (${c.dtype})`, e); }
    }
    genState = models.gen ? "ready" : "failed"; showLoad();
    status(models.gen
      ? `Quest writer ready: ${models.genName}. CLIP checks your photos. Both run on this device.`
      : "Quest writer unavailable, so quests use templates. The photo check still works.");
  })();
  return genP;
}
function startLoading() {
  if (location.protocol === "file:") status("Heads up: open this through a local server or a deployed URL, not by double-clicking the file.");
  ensureClip().then(ensureGen).catch(() => {});
}

// quests
async function writeQuest(target, vibe) {
  const prompt =
`You write one-sentence outdoor scavenger-hunt tasks. Rules: one sentence, under 20 words, start with a verb, real world only, no stories or history.
Target: a flower -> Find a flower and look closely at how its petals are arranged.
Target: a stone -> Pick out the smoothest stone you can find and photograph it.
Target: ${target} (mood: ${vibe}) ->`;
  const out = await models.gen([{ role: "user", content: prompt }], { max_new_tokens: 45, do_sample: true, temperature: 0.6, repetition_penalty: 1.1 });
  let line = String(out[0].generated_text.at(-1).content).split("\n")[0].replace(/^[\s\->]+/, "").trim();
  line = (line.match(/^[^.!?]*[.!?]?/) || [line])[0].trim();
  const words = target.replace(/^(a|an|the) /, "").split(" ").filter((w) => w.length >= 3 && w !== "over");
  const mentionsTarget = words.some((w) => new RegExp("\\b" + w.slice(0, 3), "i").test(line));
  const drifting = /\b(ancient|reveals?|hidden|secret|map|history|legend|story|magic|empire)\b/i.test(line) || /ing$/i.test(line.split(" ")[0] || "");
  return line.split(" ").length <= 24 && line.length >= 12 && mentionsTarget && !drifting ? line : null;
}

let questSeq = 0;
async function newQuest(keepResult = false) {
  const seq = ++questSeq;
  const diff = randomDiff(), vibe = state.vibe, target = pick(TARGETS[diff]);
  if (!keepResult) { $("result").textContent = ""; $("result").className = ""; $("preview").hidden = true; }
  let text = template(vibe, target);
  state.quest = { text, target, diff, done: false };
  if (models.gen) {
    state.quest.text = "Writing your quest…"; render();
    try { text = (await writeQuest(target, vibe)) || text; } catch (e) { console.error(e); }
  }
  if (seq !== questSeq) return;
  state.quest.text = text; save(); render();
}
function dailyQuest() {
  if (state.dailyDone === utcDay()) return;
  const [target, diff] = dailyTarget();
  questSeq++;
  $("result").textContent = ""; $("result").className = ""; $("preview").hidden = true;
  state.quest = { text: `Today's shared quest: find ${target}.`, target, diff, daily: true, done: false };
  save(); render();
}

// away bonus
let hiddenAt = null;
document.addEventListener("visibilitychange", () => {
  const q = state.quest;
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && q && !q.done) { q.awayMs = (q.awayMs || 0) + (Date.now() - hiddenAt); save(); }
  hiddenAt = null;
});
const awayBonus = (q) => Math.min(20, Math.floor((q.awayMs || 0) / 120000));

// camera
let stream = null;
async function openCamera() {
  const q = state.quest;
  if (!q || q.done) return;
  if (cooldownLeft() > 0) { updateCamBtn(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
  } catch (e) {
    console.error(e);
    $("result").className = "";
    $("result").textContent = "Couldn't open the camera. Allow camera access (it needs https or localhost).";
    return;
  }
  $("camVideo").srcObject = stream;
  $("cam").hidden = false;
  ensureClip().catch(() => {});
}
function closeCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  $("cam").hidden = true;
}
async function snap() {
  const v = $("camVideo");
  if (!v.videoWidth) return;
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  closeCamera();
  checkIn(blob);
}

// check photo
async function checkIn(file) {
  const q = state.quest;
  if (!file || !q || q.done) return;
  if (cooldownLeft() > 0) { updateCamBtn(); return; }
  const url = URL.createObjectURL(file);
  $("preview").src = url; $("preview").hidden = false;
  $("result").className = ""; $("result").textContent = "Checking your photo…";
  try {
    await ensureClip();
    const others = ALL.map(([t]) => t).filter((t) => t !== q.target).sort(() => Math.random() - 0.5).slice(0, 8);
    const negs = NEGATIVES.filter((n) => !(n === "an animal" && ANIMAL_TARGETS.includes(q.target)));
    const res = await models.clip(url, [q.target, ...others, ...negs], { hypothesis_template: "a photo of {}." });
    const ok = res[0].label === q.target && res[0].score >= 0.35;
    state.cooldownUntil = Date.now() + COOLDOWN_MS; save();
    if (ok) {
      if (state.lastDay !== today()) {
        state.streak = state.lastDay === yesterday() ? state.streak + 1 : 1;
        state.lastDay = today();
      }
      const bonus = awayBonus(q), mult = streakMult(state.streak);
      const gain = Math.round((BASE_XP[q.diff] * (q.daily ? 2 : 1) + bonus) * mult);
      state.xp += gain; state.dex[q.target] = today();
      if (q.daily) state.dailyDone = utcDay();
      q.done = true; save(); render();
      const parts = [];
      if (bonus) parts.push(`+${bonus} for time away from the screen`);
      if (mult > 1) parts.push(`x${mult.toFixed(1)} streak`);
      $("result").className = "win";
      $("result").textContent = `Quest complete! +${gain} XP` + (parts.length ? ` (${parts.join(", ")})` : "");
      setTimeout(() => { if (state.quest === q) newQuest(true); }, 1800);
    } else {
      q.failGuess = res[0].label.replace(/^an? /, "");
      save();
      updateCamBtn();
    }
    status(`Top guess: ${res[0].label} (${Math.round(res[0].score * 100)}%)`);
  } catch (e) {
    console.error(e);
    $("result").textContent = "Couldn't check that photo. Check the console for details.";
  }
}

// buttons
function renderChips() {
  $("vibeChips").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.vibe)));
}
$("vibeChips").addEventListener("click", (e) => { const v = e.target.dataset && e.target.dataset.v; if (v) { state.vibe = v; save(); renderChips(); } });
function showTab(tab) {
  $("viewQuest").hidden = tab !== "quest"; $("viewDex").hidden = tab !== "dex";
  $("tabQuest").setAttribute("aria-selected", String(tab === "quest")); $("tabDex").setAttribute("aria-selected", String(tab === "dex"));
  window.scrollTo(0, 0);
}
$("tabQuest").addEventListener("click", () => showTab("quest"));
$("tabDex").addEventListener("click", () => showTab("dex"));
renderChips();
$("skipQuest").addEventListener("click", () => newQuest());
$("dailyQuest").addEventListener("click", dailyQuest);
$("checkinBtn").addEventListener("click", openCamera);
$("snap").addEventListener("click", snap);
$("camClose").addEventListener("click", closeCamera);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("cam").hidden) closeCamera(); });
$("devUpload").hidden = !DEV;
$("photo").addEventListener("change", (e) => { checkIn(e.target.files[0]); e.target.value = ""; });

render();
if (!state.quest || state.quest.done) newQuest(true);
startLoading();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
