<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touch Grass Quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5233">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <div id="viewQuest">
      <header>
      <h1>Touch Grass<small>Quest</small></h1>
      <div class="tags">
        <div class="tag mono" id="streak">0 days streak</div>
        <div class="tag mono" id="streakMult" title="Streaks multiply your XP">XP x1.0</div>
      </div>
      </header>

      <section class="card plant" id="plant" aria-live="polite">
        <div class="art" id="plantIcon" aria-hidden="true"></div>
        <div class="grow">
          <div class="row"><span class="cond" id="stageName">Seedling</span><span class="mono" id="xpText">0 XP</span>
          </div>
          <div class="meter">
            <div id="xpBar"></div>
          </div>
          <p id="plantText"></p>
        </div>
      </section>

      <section class="daily">
        <div><strong>Today's shared quest</strong><span id="dailyText"></span></div>
        <button id="dailyQuest">Start</button>
      </section>

      <section class="card quest" aria-live="polite">
        <p class="lbl">Your quest</p>
        <p class="text" id="questText">Finding you a quest…</p>
        <p class="target" id="targetText"></p>
        <div class="quest-foot"><button id="startQuest" class="primary" hidden>Start</button></div>
      </section>

      <div class="actions" id="actions">
        <button class="primary big" id="checkinBtn" disabled>Open camera</button>
        <button id="skipQuest">Skip</button>
      </div>
      <label class="btn disabled" id="devUpload" hidden>Upload (dev only)<input type="file" id="photo" accept="image/*"
          disabled></label>

      <img id="preview" alt="Your check-in photo" hidden>
      <p id="result" role="status"></p>
      <button class="wide" id="toDex">View Grass Dex</button>
      <p id="status" role="status"></p>
      <div id="load" hidden>
        <div class="meter">
          <div id="loadBar"></div>
        </div>
        <p id="loadText"></p>
      </div>
    </div>

    <div id="viewDex" hidden>
      <button id="backQuest">Back</button>
      <header style="margin-top:1rem">
        <h1>Grass Dex<small>Your stamps</small></h1>
        <div class="tag mono" id="dexSummary">0/0</div>
      </header>
      <ul class="stamps" id="dexList"></ul>
    </div>

    <div id="cam" hidden role="dialog" aria-label="Camera">
      <video id="camVideo" playsinline muted autoplay></video>
      <div class="bar"><button id="camClose">Cancel</button><button class="primary" id="snap">Take photo</button></div>
    </div>
  </main>

  <script type="module">
    // models
    const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5/+esm";
    const LLM_CANDIDATES = [
      { id: "onnx-community/gemma-3-270m-it-ONNX", dtype: "q4", label: "Gemma 3 270M" },
      { id: "onnx-community/gemma-3-270m-it-ONNX", dtype: "q8", label: "Gemma 3 270M" },
      { id: "onnx-community/Qwen2.5-0.5B-Instruct", dtype: "q4", label: "Qwen2.5 0.5B" },
    ];
    const CLIP_ID = "Xenova/clip-vit-base-patch32";

    // game data
    const TARGETS = {
      easy: ["a tree", "a leaf", "grass", "the sky", "a cloud", "a flower", "a fence", "a lamppost", "a bush", "a log"],
      medium: ["a puddle", "a bird", "an insect", "a yellow flower", "moss", "a stone", "a mushroom", "a pinecone", "a fountain", "a statue"],
      hard: ["a spider web", "a feather", "a squirrel", "a cat", "a bridge over water", "a rainbow", "a sunset", "the moon", "a nest", "a kite"],
    };
    const ALL = Object.entries(TARGETS).flatMap(([d, l]) => l.map((t) => [t, d]));
    const BASE_XP = { easy: 10, medium: 20, hard: 40 };
    const SHARED_POOL = [ // curated, never in the normal pool
      ["a sunrise", "medium"], ["a lake", "medium"], ["a playground", "easy"],
      ["a dog", "medium"], ["a boat", "hard"], ["a campfire", "hard"],
    ];
    const SHARED_XP = 50;
    const STAGES = [
      { xp: 0, icon: "🌱", name: "Seedling" }, { xp: 100, icon: "🌿", name: "Sprout" },
      { xp: 400, icon: "🪴", name: "Young plant" }, { xp: 1000, icon: "🌳", name: "Tree" },
      { xp: 2500, icon: "🌸", name: "Blossoming tree" },
    ];
    const streakMult = (n) => 1 + Math.min(Math.max(n - 1, 0), 10) * 0.1; // x1.0 to x2.0 max
    const NEGATIVES = ["an animal", "a person", "a face", "a building", "a car", "food", "a room indoors", "a computer screen", "a screenshot", "a road", "furniture"];
    const ANIMAL_TARGETS = ["a bird", "an insect", "a squirrel", "a cat", "a dog"];
    const TEMPLATES = [
      "Take a slow walk and look for {t}.", "Find a quiet spot outside and spot {t}.", "Wander without a plan until you find {t}.",
      "Head somewhere you have never been and find {t}.", "Take the path you usually skip and find {t}.", "Go a little farther than usual and find {t}.",
      "Step outside for ten minutes and find {t}.", "Take a quick lap around the block and spot {t}.", "Look around until you find {t}.",
    ];
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const sample = (arr, n) => [...arr].sort(() => Math.random() - 0.5).slice(0, n);
    const templateFor = (t) => pick(TEMPLATES).replace("{t}", t);

    const $ = (id) => document.getElementById(id);
    const status = (msg) => { $("status").textContent = msg; };
    const DEV = location.search.includes("dev"); // dev mode
    const COOLDOWN_MS = 3 * 60 * 1000;
    const today = () => new Date().toLocaleDateString("en-CA");
    const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toLocaleDateString("en-CA"); };

    // save data
    let state = { xp: 0, streak: 0, lastDay: "", quest: null, pool: null, dex: {}, dailyDone: "", cooldownUntil: 0, started: false };
    try { Object.assign(state, JSON.parse(localStorage.getItem("tgq") || "{}")); } catch { }
    const save = () => { try { localStorage.setItem("tgq", JSON.stringify(state)); } catch { } };
    const liveStreak = () => (state.lastDay === today() || state.lastDay === yesterday() ? state.streak : 0);
    const cooldownLeft = () => (DEV ? 0 : Math.max(0, (state.cooldownUntil || 0) - Date.now()));
    const fmtWait = (ms) => { const s = Math.ceil(ms / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

    function sharedTarget() {
      let h = 0;
      for (const c of today()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return SHARED_POOL[h % SHARED_POOL.length];
    }

    // render
    function plantSVG(stage) {
      const h = 26 + stage * 12, top = 92 - h, leaves = Math.min(stage + 1, 4);
      let g = `<path d="M14 92h52" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M40 92V${top}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`;
      for (let i = 0; i < leaves; i++) {
        const y = 84 - i * ((h - 12) / leaves);
        g += `<ellipse cx="29" cy="${y}" rx="11" ry="5" transform="rotate(-28 29 ${y})" fill="var(--green)" stroke="currentColor" stroke-width="2"/>`;
        g += `<ellipse cx="51" cy="${y - 5}" rx="11" ry="5" transform="rotate(28 51 ${y - 5})" fill="var(--green)" stroke="currentColor" stroke-width="2"/>`;
      }
      if (stage >= 3) g += `<circle cx="40" cy="${stage >= 4 ? top - 2 : top - 4}" r="${stage >= 4 ? 15 : 13}" fill="var(--green)" stroke="currentColor" stroke-width="2"/>`;
      if (stage >= 4) g += [[-9, -2], [9, -6], [0, -11]].map(([dx, dy]) => `<circle cx="${40 + dx}" cy="${top - 2 + dy}" r="3.5" fill="var(--orange)" stroke="currentColor" stroke-width="1.5"/>`).join("");
      return `<svg viewBox="0 0 80 100" role="img" aria-label="Your plant">${g}</svg>`;
    }
    function renderPlant() {
      let i = 0;
      STAGES.forEach((s, k) => { if (state.xp >= s.xp) i = k; });
      const cur = STAGES[i], next = STAGES[i + 1];
      const away = state.lastDay ? Math.floor((new Date(today()) - new Date(state.lastDay)) / 864e5) : 0;
      const droop = away >= 3;
      $("plantIcon").innerHTML = plantSVG(i);
      $("plant").classList.toggle("droop", droop);
      $("stageName").textContent = cur.name;
      $("xpText").textContent = `${state.xp} XP`;
      $("xpBar").style.width = next ? Math.round((100 * (state.xp - cur.xp)) / (next.xp - cur.xp)) + "%" : "100%";
      $("plantText").textContent = droop ? "Your plant is drooping. One quest wakes it up."
        : next ? `${next.xp - state.xp} XP to ${next.name}. Streaks multiply your XP, up to x2.` : "Fully grown. Keep the streak alive.";
    }
    function renderDaily() {
  const [t] = sharedTarget();
  const bare = t.replace(/^(a|an|the) /, "");
  const art = t.slice(0, t.length - bare.length);
  const done = state.dailyDone === today();
  const active = !!(state.quest && state.quest.daily && !state.quest.done);
  $("dailyText").innerHTML = done ? "Done. A new one arrives tomorrow." : `Find ${art}<b>${bare}</b>. 50 XP.`;
      $("dailyQuest").hidden = done;
      $("dailyQuest").disabled = active;
      $("dailyQuest").textContent = active ? "In progress" : "Start";
    }
    function renderDex() {
      const known = new Set(ALL.map(([t]) => t));
      const bonus = Object.keys(state.dex).filter((t) => state.dex[t] && !known.has(t)).sort();
      const got = ALL.filter(([t]) => state.dex[t]).length + bonus.length;
      $("dexSummary").textContent = `${got}/${ALL.length + SHARED_POOL.length}`;
      const stampDate = (day) => new Date(day + "T00:00").toLocaleDateString("en", { day: "2-digit", month: "short" });
      const gotStamp = (t, day, i) => `<li class="stamp got" style="--r:${((i * 37) % 7) - 3}deg"><b>${t.replace(/^(a|an|the) /, "")}</b><small>${stampDate(day)}</small></li>`;
      $("dexList").innerHTML = ALL.map(([t], i) => {
        const day = state.dex[t];
        if (!day) return `<li class="stamp" style="--r:0deg"><b>?</b><small>locked</small></li>`;
        return gotStamp(t, day, i);
      }).join("") + bonus.map((t, k) => gotStamp(t, state.dex[t], ALL.length + k)).join("");
    }
    function titleCase(s) { return s.replace(/\w\S*/g, (w) => w[0].toUpperCase() + w.slice(1)); }
    function questSubHTML(q) {
      const qDiff = q.diff || "easy";
      const qBase = q.daily ? SHARED_XP : (BASE_XP[qDiff] || 10);
      const diffName = qDiff[0].toUpperCase() + qDiff.slice(1);
      return `${q.done ? "Done" : "Photo target"}: ${titleCase(q.target.replace(/^(a|an|the) /, ""))}<br>Difficulty: ${diffName}<br>XP Gain: ${qBase} XP`;
    }
    function updateCamBtn() {
      const q = state.quest, b = $("checkinBtn");
      const usable = !!q && !q.done;
      const wait = usable ? cooldownLeft() : 0;
      const locked = usable && wait > 0;
      b.disabled = !usable || locked;
      const left = fmtWait(wait);
      b.textContent = locked ? `Back in ${left}` : "Open camera";
      $("photo").disabled = b.disabled;
      $("devUpload").classList.toggle("disabled", b.disabled);
      if (!q) return;
      if (locked && q.failGuess) {
        $("targetText").textContent = `Not quite. I think that looks like "${q.failGuess}". Try another angle.`;
        $("result").className = "";
        $("result").textContent = `Go enjoy the outside world in the meantime — back in ${left}`;
      } else if (locked) {
        $("targetText").textContent = `Go enjoy the outside world — back in ${left}`;
      } else {
        $("targetText").innerHTML = questSubHTML(q);
        if (q.failGuess && $("result").textContent.startsWith("Go enjoy")) {
          $("result").className = "";
          $("result").textContent = `Not quite. I think that looks like "${q.failGuess}". Try another angle.`;
        }
      }
    }
    function render() {
      const q = state.quest;
      const welcome = !q && !state.started;
      const poolDone = !q && state.started && state.pool && state.pool.date === today() && poolLeft().length === 0;
      if (q) {
        $("questText").textContent = q.text;
        $("targetText").innerHTML = questSubHTML(q);
      } else if (welcome) {
        $("questText").textContent = "Ready to touch grass?";
        $("targetText").textContent = "Your first quest is one tap away.";
      } else if (poolDone) {
        $("questText").textContent = "That's all 5 for today.";
        $("targetText").textContent = "Fresh quests arrive tomorrow.";
      }
      $("startQuest").hidden = !welcome;
      $("actions").style.display = (welcome || poolDone) ? "none" : "";
      if (q && !q.daily) $("skipQuest").disabled = poolLeft().length <= 1;
      else $("skipQuest").disabled = false;
      const s = liveStreak();
      $("streak").textContent = `${s} day${s === 1 ? "" : "s"} streak`;
  $("streakMult").textContent = `XP x${streakMult(s).toFixed(1)}`;
      renderPlant(); renderDaily(); renderDex(); updateCamBtn();
    }
    setInterval(updateCamBtn, 1000);

    // load models
    const models = { gen: null, genName: "", clip: null };
    const progress = { clip: 0, gen: 0 };
    let clipState = "idle", genState = "idle", libP = null, clipP = null, genP = null;
    const lib = () => (libP ||= import(TRANSFORMERS_URL));
    function showLoad() {
      const loading = clipState === "loading";
      $("load").hidden = !loading;
      if (loading) { $("loadBar").style.width = Math.round(progress.clip * 100) + "%"; $("loadText").textContent = `Getting the photo checker ready… ${Math.round(progress.clip * 100)}%`; }
    }
    function tracker(key) {
      const files = {};
      return (p) => {
        if (p.status === "progress" && p.total) files[p.file] = { l: p.loaded, t: p.total };
        else if (p.status === "done" && files[p.file]) files[p.file].l = files[p.file].t;
        const v = Object.values(files);
        const t = v.reduce((a, f) => a + f.t, 0);
        progress[key] = t ? v.reduce((a, f) => a + f.l, 0) / t : 0;
        showLoad();
      };
    }
    function ensureClip() {
      if (clipP) return clipP;
      clipState = "loading"; showLoad();
      clipP = (async () => {
        const { pipeline } = await lib();
        models.clip = await pipeline("zero-shot-image-classification", CLIP_ID, { progress_callback: tracker("clip") });
        clipState = "ready"; showLoad();
      })().catch((e) => {
        clipState = "failed"; clipP = null; showLoad();
        status("Photo checker failed to load: " + (e.message || e));
        throw e;
      });
      return clipP;
    }
    function ensureGen() {
      if (genP) return genP;
      genState = "loading"; showLoad();
      genP = (async () => {
        const { pipeline } = await lib();
        for (const c of LLM_CANDIDATES) {
          try {
            models.gen = await pipeline("text-generation", c.id, { dtype: c.dtype, progress_callback: tracker("gen") });
            models.genName = c.label;
            break;
          } catch (e) { console.error(`Quest model failed: ${c.id} (${c.dtype})`, e); }
        }
        genState = models.gen ? "ready" : "failed"; showLoad();
        status(models.gen
          ? `Quest writer ready (${models.genName}), on-device.`
          : "Quest writer unavailable, using templates.");
      })().catch(() => {
        genState = "failed"; showLoad();
        status("Quest writer unavailable, using templates.");
      });
      return genP;
    }
    function startLoading() {
      if (location.protocol === "file:") status("Heads up: open this through a local server or a deployed URL, not by double-clicking the file.");
      ensureClip().catch(() => { }).then(ensureGen).catch(() => { });
    }

    // quests
    async function writeQuest(target) {
      const prompt =
        `You write one-sentence outdoor scavenger-hunt tasks. Rules: one sentence, under 20 words, start with a verb, real world only, no stories or history.
Target: a flower -> Find a flower and look closely at how its petals are arranged.
Target: a stone -> Pick out the smoothest stone you can find and photograph it.
Target: ${target} ->`;
      const out = await models.gen([{ role: "user", content: prompt }], { max_new_tokens: 45, do_sample: true, temperature: 0.6, repetition_penalty: 1.1 });
      let line = String(out[0].generated_text.at(-1).content).split("\n")[0].replace(/^[\s\->]+/, "").trim();
      line = (line.match(/^[^.!?]*[.!?]?/) || [line])[0].trim();
      const words = target.replace(/^(a|an|the) /, "").split(" ").filter((w) => w.length >= 3 && w !== "over");
      const mentionsTarget = words.some((w) => new RegExp("\\b" + w.slice(0, 3), "i").test(line));
      const drifting = /\b(ancient|reveals?|hidden|secret|map|history|legend|story|magic|empire)\b/i.test(line) || /ing$/i.test(line.split(" ")[0] || "");
      return line.split(" ").length <= 24 && line.length >= 12 && mentionsTarget && !drifting ? line : null;
    }

    let questSeq = 0;
    // daily pool: 2 easy, 2 medium, 1 hard, fixed for the day
    function ensurePool() {
      if (state.pool && state.pool.date === today() && Array.isArray(state.pool.items) && state.pool.items.length === 5) return state.pool;
      const hadPool = !!state.pool;
      state.pool = {
        date: today(),
        items: [
          ...sample(TARGETS.easy, 2).map((target) => ({ target, diff: "easy", done: false })),
          ...sample(TARGETS.medium, 2).map((target) => ({ target, diff: "medium", done: false })),
          ...sample(TARGETS.hard, 1).map((target) => ({ target, diff: "hard", done: false })),
        ],
      };
      if (hadPool) state.quest = null; // new day, drop the stale quest
      save();
      return state.pool;
    }
    const poolLeft = () => (state.pool && state.pool.date === today() ? state.pool.items.filter((i) => !i.done) : []);
    async function newQuest(keepResult = false, excludeIdx = -1) {
      const seq = ++questSeq;
      state.started = true;
      const pool = ensurePool();
      const open = pool.items.map((item, idx) => ({ ...item, idx })).filter((i) => !i.done && i.idx !== excludeIdx);
      const cands = open.length ? open : pool.items.map((item, idx) => ({ ...item, idx })).filter((i) => !i.done);
      if (!cands.length) { state.quest = null; save(); render(); return; } // all 5 done
      const deal = pick(cands);
      if (!keepResult) { $("result").textContent = ""; $("result").className = ""; $("preview").hidden = true; }
      let text = templateFor(deal.target);
      state.quest = { text, target: deal.target, diff: deal.diff, poolIdx: deal.idx, done: false };
  if (models.gen) {
    try { text = (await writeQuest(deal.target)) || text; } catch (e) { console.error(e); }
  }
  if (seq !== questSeq || state.quest.done) return;
      state.quest.text = text; save(); render();
    }
    function dailyQuest() {
      if (state.dailyDone === today()) return;
      const [target, diff] = sharedTarget();
      questSeq++;
      $("result").textContent = ""; $("result").className = ""; $("preview").hidden = true;
      state.started = true;
      state.quest = { text: `Go outside and find ${target}.`, target, diff, daily: true, done: false };
      save(); render();
    }

    // away bonus
    let hiddenAt = null;
    document.addEventListener("visibilitychange", () => {
      const q = state.quest;
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (hiddenAt && q && !q.done) { q.awayMs = (q.awayMs || 0) + (Date.now() - hiddenAt); save(); }
      hiddenAt = null;
    });
    const awayBonus = (q) => Math.min(20, Math.floor((q.awayMs || 0) / 120000));

    // camera
    let stream = null;
    async function openCamera() {
      const q = state.quest;
      if (!q || q.done) return;
      if (cooldownLeft() > 0) { updateCamBtn(); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      } catch (e) {
        console.error(e);
        $("result").className = "";
        $("result").textContent = "Couldn't open the camera. Allow camera access (it needs https or localhost).";
        return;
      }
      $("camVideo").srcObject = stream;
      $("cam").hidden = false;
      ensureClip().catch(() => { });
    }
    function closeCamera() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      $("cam").hidden = true;
    }
    async function snap() {
      const v = $("camVideo");
      if (!v.videoWidth) return;
      const c = document.createElement("canvas");
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
      closeCamera();
      checkIn(blob);
    }

    // check photo
    async function checkIn(file) {
      const q = state.quest;
      if (!file || !q || q.done) return;
      if (cooldownLeft() > 0) { updateCamBtn(); return; }
      const url = URL.createObjectURL(file);
      $("preview").src = url; $("preview").hidden = false;
      $("result").className = ""; $("result").textContent = "Checking your photo…";
      try {
        await ensureClip();
        const others = ALL.map(([t]) => t).filter((t) => t !== q.target).sort(() => Math.random() - 0.5).slice(0, 8);
        const negs = NEGATIVES.filter((n) => !(n === "an animal" && ANIMAL_TARGETS.includes(q.target)));
        const res = await models.clip(url, [q.target, ...others, ...negs], { hypothesis_template: "a photo of {}." });
        const ok = res[0].label === q.target && res[0].score >= 0.35;
        state.cooldownUntil = Date.now() + COOLDOWN_MS; save();
        if (ok) {
          if (state.lastDay !== today()) {
            state.streak = state.lastDay === yesterday() ? state.streak + 1 : 1;
            state.lastDay = today();
          }
          const bonus = awayBonus(q), mult = streakMult(state.streak);
          const gain = Math.round(((q.daily ? SHARED_XP : BASE_XP[q.diff]) + bonus) * mult);
          state.xp += gain; state.dex[q.target] = today();
          if (q.daily) state.dailyDone = today();
          if (!q.daily && Number.isInteger(q.poolIdx) && state.pool && state.pool.date === today() && state.pool.items[q.poolIdx]) state.pool.items[q.poolIdx].done = true;
          q.done = true; save(); render();
          const parts = [];
          if (bonus) parts.push(`+${bonus} for time away from the screen`);
          if (mult > 1) parts.push(`x${mult.toFixed(1)} streak`);
          $("result").className = "win";
          $("result").textContent = `Quest complete! +${gain} XP` + (parts.length ? ` (${parts.join(", ")})` : "");
          setTimeout(() => { if (state.quest === q) newQuest(true); }, 1800);
        } else {
          q.failGuess = res[0].label.replace(/^an? /, "");
          save();
          updateCamBtn();
        }
        status(`Top guess: ${res[0].label} (${Math.round(res[0].score * 100)}%)`);
      } catch (e) {
        console.error(e);
        $("result").textContent = "Couldn't check that photo. Check the console for details.";
      }
    }

    // buttons
    function showTab(tab) {
      $("viewQuest").hidden = tab !== "quest"; $("viewDex").hidden = tab !== "dex";
      window.scrollTo(0, 0);
    }
    $("toDex").addEventListener("click", () => showTab("dex"));
    $("backQuest").addEventListener("click", () => showTab("quest"));
    $("startQuest").addEventListener("click", () => { state.started = true; save(); newQuest(); });
    $("skipQuest").addEventListener("click", () => newQuest(false, state.quest && Number.isInteger(state.quest.poolIdx) ? state.quest.poolIdx : -1));
    $("dailyQuest").addEventListener("click", dailyQuest);
    $("checkinBtn").addEventListener("click", openCamera);
    $("snap").addEventListener("click", snap);
    $("camClose").addEventListener("click", closeCamera);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("cam").hidden) closeCamera(); });
    $("devUpload").hidden = !DEV;
    $("photo").addEventListener("change", (e) => { checkIn(e.target.files[0]); e.target.value = ""; });

    ensurePool();
    render();
    if (state.quest && !state.quest.done) { }
    else if (!state.started) { state.quest = null; save(); render(); }
    else newQuest(true);
    startLoading();
    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => { });
  </script>
</body>

</html>
